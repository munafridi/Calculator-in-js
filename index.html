<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10131d" />
  <meta name="description" content="A clean, responsive calculator built with HTML, CSS, and JavaScript." />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="calculator" aria-label="Calculator">
      <section class="display" aria-live="polite" aria-atomic="true">
        <div class="display-label" id="expression"></div>
        <div class="display-value" id="result">0</div>
      </section>

      <section class="keypad" aria-label="Calculator keys">
        <button class="key key-function" data-action="clear" aria-label="Clear all">AC</button>
        <button class="key key-function" data-action="sign" aria-label="Change sign">+/−</button>
        <button class="key key-function" data-action="percent" aria-label="Percent">%</button>
        <button class="key key-operator" data-operator="÷" aria-label="Divide">÷</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key key-operator" data-operator="×" aria-label="Multiply">×</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key key-operator" data-operator="−" aria-label="Subtract">−</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key key-operator" data-operator="+" aria-label="Add">+</button>

        <button class="key key-zero" data-number="0">0</button>
        <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
      </section>
    </section>
  </main>
</body>
</html>
